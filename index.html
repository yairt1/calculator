<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="calculator">
      <div id="display"></div>
      <div class="buttons">
        <div class="delete">C</div>
        <div class="delete">DEL</div>
        <div>%</div>
        <div class="operators">÷</div>

        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div class="operators">×</div>

        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div class="operators">-</div>

        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div class="operators">+</div>

        <div id="zero">0</div>
        <div>.</div>
        <div class="calculate">=</div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
